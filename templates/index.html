<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Bot Dashboard</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; border: 1px solid #333; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,255,127,0.1); }
        h1 { color: #00e676; }
        .status { margin-top: 20px; font-size: 1.2rem; }
        .dot { height: 10px; width: 10px; background-color: #00e676; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SHADOW OCR BOT</h1>
        <div class="status">
            <span class="dot"></span> System Operational
        </div>
        <p>Bot is running on Docker Container.</p>
    </div>
</body>
</html>
